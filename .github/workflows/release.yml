name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm and npm with trusted publishing support
        run: npm install --global pnpm@11.13.1 npm@latest

      - name: Check tag matches package version
        working-directory: sdk
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sdk/package.json version $version"
            exit 1
          fi

      - name: Build and test
        working-directory: sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - name: Publish to npm
        working-directory: sdk
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
