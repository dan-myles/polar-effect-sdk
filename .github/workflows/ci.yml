name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check out upstream generator and specs
        run: |
          git submodule update --init --depth 1 --filter=blob:none upstream
          git -C upstream sparse-checkout set sdk/generator docs/openapi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@11.13.1

      - name: Install generator dependencies
        working-directory: generator
        run: uv sync --frozen

      - name: Lint generator
        working-directory: generator
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check .

      - name: Test generator
        working-directory: generator
        run: uv run pytest

      - name: Generate SDK (install, format, lint, typecheck, build, test)
        working-directory: generator
        run: uv run python cli.py

      - name: Check generated SDK is up to date
        run: |
          if [ -n "$(git status --porcelain -- sdk)" ]; then
            git status --porcelain -- sdk
            git diff --stat -- sdk
            echo "::error::sdk/ is out of date. Run 'uv run python cli.py' in generator/ and commit the result."
            exit 1
          fi
